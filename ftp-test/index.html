<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-диспетчерская — тест публикации</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #e5e7eb; }
    main { width: min(680px, calc(100% - 48px)); padding: 40px; border: 1px solid #374151; border-radius: 16px; background: #1f2937; box-shadow: 0 20px 50px rgb(0 0 0 / 25%); }
    h1 { margin: 0 0 16px; font-size: clamp(28px, 5vw, 44px); }
    p { margin: 8px 0; line-height: 1.55; color: #cbd5e1; }
    .ok { color: #86efac; font-weight: 700; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <main>
    <h1>Мини-диспетчерская</h1>
    <p class="ok">Автоматическая публикация работает.</p>
    <p>Тестовая страница загружена из GitHub Actions на REG.RU по FTP.</p>
    <p>Контрольный файл: <code>ftp-test/index.html</code></p>
  </main>
</body>
</html>
